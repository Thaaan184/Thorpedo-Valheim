name: thorpedo

services:
  thorpedo:
    build: .
    container_name: thorpedo-valheim
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - PANEL_PORT=28456
      - SAVE_DIR=/config
      - INSTALL_DIR=/valheim
    ports:
      - "28456:28456"
      - "${SERVER_PORT:-2456}:${SERVER_PORT:-2456}/udp"
      - "${SERVER_QUERY_PORT:-2457}:${SERVER_QUERY_PORT:-2457}/udp"
    volumes:
      - ./data:/config
      - ./.env:/config/.env:rw
      - ./backups:/config/backups:rw
      - thorpedo-game-data:/valheim
      - ./plugins/NoCheatFlag.dll:/opt/bepinex/BepInEx/plugins/NoCheatFlag.dll:ro
      - ./plugins/ScheduledMessages.dll:/opt/bepinex/BepInEx/plugins/ScheduledMessages.dll:ro
      - ./plugins/Gjallarhorn.dll:/opt/bepinex/BepInEx/plugins/Gjallarhorn.dll:ro
      - ./plugins/WorkbenchLove.dll:/opt/bepinex/BepInEx/plugins/WorkbenchLove.dll:ro
      - ./plugins/ServerDevcommands.dll:/opt/bepinex/BepInEx/plugins/ServerDevcommands.dll:ro
      - ./plugins/CrossplayJoinCodeFix.dll:/opt/bepinex/BepInEx/plugins/CrossplayJoinCodeFix.dll:ro
      - ./config/scheduledmessages.cfg:/valheim/BepInEx/config/scheduledmessages.cfg:rw
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:28456/api/status > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0@sha256:5b7748d3e8564f1cac3d3a295a23640136fbf774c76a9509bd262d16b324b06b
    container_name: thorpedo-playit
    restart: unless-stopped
    network_mode: host
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
    depends_on:
      thorpedo:
        condition: service_started

volumes:
  thorpedo-game-data:
    name: thorpedo-game-data
