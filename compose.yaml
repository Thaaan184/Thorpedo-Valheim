services:
  thorpedo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thorpedo-valheim
    restart: unless-stopped
    ports:
      - "28456:28456"
      - "2456-2457:2456-2457/udp"
    environment:
      SERVER_NAME: "${SERVER_NAME:-BarudakViking}"
      WORLD_NAME: "${WORLD_NAME:-BarudakValheim}"
      SERVER_PORT: "${SERVER_PORT:-2456}"
      SERVER_PASSWORD: "${SERVER_PASSWORD:-${SERVER_PASS:-semogalancar}}"
      SERVER_PASS: "${SERVER_PASSWORD:-${SERVER_PASS:-semogalancar}}"
      PANEL_PORT: "28456"
      SAVE_DIR: "/config"
      INSTALL_DIR: "/valheim"
      BEPINEX: "true"
      CROSSPLAY: "true"
      SAVE_INTERVAL: "1800"
      WORLD_MODIFIERS: "${WORLD_MODIFIERS:-resources=muchmore portals=casual}"
      WORLD_KEYS: "${WORLD_KEYS:-playerevents}"
      UPDATE_ON_START: "${UPDATE_ON_START:-false}"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      SESSION_SECRET: "${SESSION_SECRET:-thorpedo_ultra_secure_secret_entropy_salt_9981}"
      PANEL_SECRET_KEY: "${SESSION_SECRET:-thorpedo_ultra_secure_secret_entropy_salt_9981}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_REPO: "${GITHUB_REPO:-Thaaan184/Thorpedo-Valheim}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
    volumes:
      - ./data:/config
      - ./.env:/config/.env:rw
      - ./backups:/config/backups:rw
      - ./plugins:/valheim/BepInEx/plugins:rw
      - ./panel:/panel:rw
      - ./config/scheduledmessages.cfg:/valheim/BepInEx/config/scheduledmessages.cfg:rw
      - thorpedo-game-data:/valheim
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:28456/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  thorpedo-game-data:
    name: thorpedo-game-data
