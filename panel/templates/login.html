<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Thorpedo Valheim Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              base: '#0F1115',
              surface: '#161A22',
              border: '#242C38',
              amber: '#D97706',
              emerald: '#10B981',
              crimson: '#EF4444',
              text: '#F1F5F9',
              muted: '#94A3B8',
            }
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0F1115] text-[#F1F5F9] font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#161A22] border border-[#242C38] rounded-xl p-8 shadow-2xl relative overflow-hidden">
    <!-- Top accent line -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-[#D97706]"></div>

    <!-- Header Logo -->
    <div class="mb-6 text-center">
      <div class="font-mono font-bold text-2xl tracking-wider text-[#D97706]">THORPEDO</div>
      <div class="font-mono text-xs tracking-widest text-[#94A3B8] uppercase mt-1">Valheim Dedicated Server Panel</div>
      <p class="text-sm text-[#94A3B8] mt-2">Otentikasi khusus admin pengelola</p>
    </div>

    <!-- Error Banner -->
    {% if error %}
    <div class="mb-5 bg-[#3B1215] border border-[#EF4444] text-[#FCA5A5] px-4 py-3 rounded-lg text-sm flex items-center gap-3">
      <svg class="w-5 h-5 flex-shrink-0 text-[#EF4444]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block font-mono text-xs uppercase tracking-wider text-[#94A3B8] mb-1.5" for="username">Username Admin</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          autocomplete="username"
          placeholder="admin"
          class="w-full bg-[#0F1115] border border-[#242C38] rounded-lg px-3.5 py-2.5 text-[#F1F5F9] placeholder-[#94A3B8]/40 focus:outline-none focus:border-[#D97706] transition font-sans text-sm"
        />
      </div>

      <div>
        <label class="block font-mono text-xs uppercase tracking-wider text-[#94A3B8] mb-1.5" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autocomplete="current-password"
          placeholder="••••••••••••"
          class="w-full bg-[#0F1115] border border-[#242C38] rounded-lg px-3.5 py-2.5 text-[#F1F5F9] placeholder-[#94A3B8]/40 focus:outline-none focus:border-[#D97706] transition font-sans text-sm"
        />
      </div>

      <button 
        type="submit" 
        class="w-full bg-[#D97706] hover:bg-[#b45309] text-[#0F1115] font-bold font-mono text-sm py-2.5 px-4 rounded-lg transition duration-150 flex items-center justify-center gap-2 mt-2 shadow-lg shadow-[#D97706]/10"
      >
        <span>Masuk ke Panel</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-[#242C38] text-center text-xs text-[#94A3B8]/60 font-mono">
      Thorpedo Valheim &copy; 2026 &bull; Secured with PBKDF2 HMAC
    </div>
  </div>

</body>
</html>
