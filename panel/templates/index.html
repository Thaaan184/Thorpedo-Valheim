<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thorpedo · Valheim Control</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1115;--s:#161A22;--s2:#1B202A;--b:#242C38;--t:#F1F5F9;--m:#94A3B8;--a:#D97706;--ok:#10B981;--w:#F59E0B;--bad:#EF4444;--ice:#0284C7;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:13px/1.5 Inter,system-ui,sans-serif;height:100vh;overflow:hidden}
#app{display:grid;grid-template-columns:184px 1fr;grid-template-rows:60px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--b);background:var(--s)}
.brand{font:700 15px var(--mono);letter-spacing:.14em}.sp{flex:1}.mono{font-family:var(--mono)}
nav{border-right:1px solid var(--b);background:var(--s);padding:12px 0;display:flex;flex-direction:column;justify-content:space-between}
.nav-links{display:flex;flex-direction:column}
nav a{display:flex;justify-content:space-between;padding:9px 20px;color:var(--m);cursor:pointer;border-left:2px solid transparent;text-decoration:none}
nav a:hover{color:var(--t)}nav a.on{color:var(--t);border-color:var(--a);background:var(--bg)}nav small{font:11px var(--mono);color:var(--a)}
.lang-box{padding:12px 14px;border-top:1px solid var(--b)}
.lang-pill{display:flex;background:var(--s2);border:1px solid var(--b);border-radius:4px;overflow:hidden;padding:2px}
.lang-opt{flex:1;background:none;border:0;color:var(--m);font:600 11px Inter,sans-serif;padding:6px 2px;cursor:pointer;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:4px;transition:0.15s}
.lang-opt:hover{color:var(--t)}.lang-opt.active{background:var(--bg);color:var(--a);box-shadow:0 1px 3px #0006}
main{overflow:auto;padding:24px 28px 90px;position:relative}
h2{font:700 11px var(--mono);letter-spacing:.14em;color:var(--m);text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:12px}h2:after{content:"";flex:1;height:1px;background:var(--b)}
.chip{display:inline-flex;align-items:center;gap:7px;font:700 11px var(--mono);letter-spacing:.08em;padding:4px 9px;border:1px solid var(--b);border-radius:2px;color:var(--m)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--m)}.chip.running{color:var(--ok);border-color:#0e5a43}.chip.running i{background:var(--ok);animation:p 2s infinite}
.chip.stopped{color:var(--bad);border-color:#6b2327}.chip.stopped i{background:var(--bad)}.chip.rebooting{color:var(--w);border-color:#6b4d10}.chip.rebooting i{background:var(--w);animation:p .7s infinite}
.chip.bad{color:var(--bad);border-color:#6b2327}@keyframes p{50%{opacity:.25}}
.btn{font:600 12px Inter,sans-serif;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:3px;padding:7px 13px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--m)}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.p{background:var(--a);border-color:var(--a);color:#14100a}.btn.p:hover:not(:disabled){background:#ea8a12;border-color:#ea8a12}
.btn.d{color:var(--bad);border-color:#5a2a2e;background:transparent}.btn.d:hover:not(:disabled){background:var(--bad);color:#14100a;border-color:var(--bad)}.btn.g{background:transparent;padding:4px 9px;font-size:11px}.btn.g.d{border-color:var(--b)}
.split{position:relative;display:flex}.split .btn:first-child{border-radius:3px 0 0 3px}.split .ch{border-radius:0 3px 3px 0;border-left:1px solid #14100a55;padding:7px 9px}
.menu{position:absolute;top:100%;right:0;margin-top:6px;min-width:250px;background:var(--s2);border:1px solid var(--b);border-radius:3px;padding:4px;z-index:20;box-shadow:0 8px 24px #0008}.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--t);padding:8px 10px;font:12px Inter;cursor:pointer;border-radius:2px}.menu button:hover{background:var(--b)}.menu hr{border:0;border-top:1px solid var(--b);margin:4px 0}
.pw{display:flex;align-items:center;gap:8px}.sep{width:1px;height:22px;background:var(--b);margin:0 4px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;margin-bottom:28px}.box{border:1px solid var(--b);background:var(--s)}
.plaque{padding:20px 22px;display:flex;flex-direction:column;gap:14px}.digits{display:flex;gap:6px}.digits i{font:700 46px/1 var(--mono);font-style:normal;color:var(--a);background:var(--bg);border:1px solid var(--b);padding:12px 0;width:50px;text-align:center}
.plaque.off .digits i{color:var(--m);opacity:.5}.row{display:flex;align-items:center;gap:10px}.mut{color:var(--m)}.s11{font-size:11px}
.vit{padding:6px 18px}.vit div{display:grid;grid-template-columns:70px 1fr 110px;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--b)}.vit div:last-child{border:0}.vit b{font:700 14px var(--mono);text-align:right}
svg.sl{width:100%;height:26px}.fix{margin-bottom:28px}.fix ol{list-style:none;padding:0}
.fix li{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--b)}.fix li:last-child{border:0}
.fix .n{font:700 13px var(--mono);color:var(--a);border:1px solid var(--b);width:26px;height:26px;display:grid;place-items:center}.fix p{font-size:12px;color:var(--m)}.fix .res{color:var(--ok);font:12px var(--mono);margin-top:3px}
table{width:100%;border-collapse:collapse}th{font:700 10px var(--mono);letter-spacing:.12em;color:var(--m);text-align:left;padding:10px 16px;border-bottom:1px solid var(--b);text-transform:uppercase}
td{padding:11px 16px;border-bottom:1px solid var(--b)}tr:last-child td{border:0}td.r,th.r{text-align:right}td .row{justify-content:flex-end}tr:hover td{background:#ffffff05}
.tag{font:700 10px var(--mono);letter-spacing:.08em;padding:2px 7px;border:1px solid var(--b);color:var(--m)}.tag.gh{color:var(--ice);border-color:#0b4a6b}.tag.adm{color:var(--a);border-color:#6b3d08}.tag.ok{color:var(--ok);border-color:#0e5a43}
.term{background:#0A0C10;border:1px solid var(--b);font:12px/1.75 var(--mono);padding:14px 16px;overflow:auto;height:calc(100vh - 260px);min-height:240px}.term.mini{height:auto;max-height:170px}
.term div{white-space:pre-wrap}.term .t{color:#4b5563}.INFO{color:var(--m)}.CONN{color:var(--ok)}.DEATH{color:var(--w)}.WARN{color:var(--w)}.ERROR{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--b);border-radius:3px;overflow:hidden}.seg button{background:var(--s);color:var(--m);border:0;border-right:1px solid var(--b);padding:7px 12px;font:12px Inter;cursor:pointer}.seg button:last-child{border:0}.seg button:hover{color:var(--t)}.seg button.on{background:#3a2608;color:var(--a);font-weight:600}
.cmd{display:flex;margin-top:10px;border:1px solid var(--b);background:#0A0C10}.cmd span{padding:9px 0 0 14px;color:var(--a);font:700 13px var(--mono)}.cmd input{flex:1;background:none;border:0;color:var(--t);font:13px var(--mono);padding:9px 12px;outline:0}.cmd .btn{border:0;border-left:1px solid var(--b);border-radius:0}
.list{display:flex;flex-direction:column}.list>div{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--b)}.list>div:last-child{border:0}.list small{display:block;color:var(--m);font-size:12px}.list b{font-weight:600}
.tog{width:36px;height:20px;border-radius:10px;background:var(--b);border:0;position:relative;cursor:pointer}.tog:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--t);transition:.15s}.tog.on{background:var(--ok)}.tog.on:after{left:19px}
.bar{position:sticky;bottom:-70px;margin-top:20px;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--s2);border:1px solid #6b4d10;border-left:3px solid var(--w);z-index:10}
.top2{display:flex;align-items:center;gap:12px;margin-bottom:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.add{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--b)}
input.in,select.in,textarea.in{background:var(--bg);border:1px solid var(--b);color:var(--t);padding:7px 10px;font:12px var(--mono);border-radius:3px;outline:0}input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--a)}
.ov{position:fixed;inset:0;background:#05060acc;display:grid;place-items:center;z-index:50}.ov[hidden]{display:none}.mod{width:520px;max-width:94vw;background:var(--s);border:1px solid var(--b);padding:24px;display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow-y:auto}.mod.dng{border-color:#6b2327}.mod h3{font:700 15px var(--mono)}.mod label{display:flex;flex-direction:column;gap:6px;color:var(--m);font-size:12px}
.card-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:28px}
.card{border:1px solid var(--b);background:var(--s);padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:center;justify-content:space-between}
.card-head h3{font:700 13px var(--mono);color:var(--t)}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}#toast div{background:var(--s2);border:1px solid var(--b);border-left:3px solid var(--ok);padding:10px 14px;font-size:12px}#toast .e{border-left-color:var(--bad)}
@media(max-width:860px){ #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}header{flex-wrap:wrap;padding:10px 14px}nav{display:flex;overflow:auto;border:0;border-bottom:1px solid var(--b)}nav a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:10px 14px}nav a.on{border-color:var(--a)}.grid,.two{grid-template-columns:1fr}main{padding:16px 14px 90px}.digits i{width:40px;font-size:34px}}
</style></head><body><div id="app"><header id="hd"></header><nav id="nv"><div class="nav-links" id="nl"></div><div class="lang-box" id="lb"></div></nav><main id="mn"></main></div>
<div class="ov" id="ov" hidden></div><div id="toast"></div>
<input type="file" id="file-world" style="display:none" accept=".db,.fwl,.zip">
<input type="file" id="file-mod" style="display:none" accept=".dll,.zip">

<script>
const API = '';
const $ = s => document.querySelector(s);

let LANG = localStorage.getItem('thorpedo_lang') || 'en';

const TXT = {
  en: {
    restart: 'Restart', restart1m: 'Restart, 1 min countdown', restart5m: 'Restart, 5 min countdown',
    forceKill: 'Force Kill & Restart', saveWorld: 'Save World', stop: 'Stop', start: 'Start Server',
    running: 'RUNNING', stopped: 'STOPPED', rebooting: 'REBOOTING',
    active: 'ACTIVE', stall: 'STALL', uptime: 'UPTIME', logout: 'Logout',
    joinCode: 'Join Code', copyCode: 'Copy Code', copyIp: 'Copy IP', copyPass: 'Copy Password',
    broadcastDiscord: 'Broadcast to Discord', serverPassword: 'Server Password', serverName: 'Server Name',
    registeredPlayFab: 'Registered on PlayFab', directJoin: 'Direct Join', hostVitals: 'Host Vitals',
    troubleshootTitle: 'Server Not Visible in Valheim?',
    step1Title: 'Check PlayFab Lobby', step1Desc: 'Verify if server is registered in Azure matchmaking.', checkBtn: 'Check',
    step2Title: 'Reset Matchmaking Socket', step2Desc: 'Reopen lobby socket and acquire fresh Join Code.', resetBtn: 'Reset Lobby',
    step3Title: 'Force Restart', step3Desc: 'If engine is hanging: flush world, kill process and reboot immediately.', killBtn: 'Kill & Restart',
    onlinePlayers: 'Online Adventurers', charCol: 'Character', steamCol: 'Steam ID', sessionCol: 'Online', pingCol: 'Status', actCol: 'Actions',
    latestLogs: 'Latest Logs', openConsole: 'Open Console', noPlayers: 'No players currently online.',
    allLogs: 'All', connLogs: 'Conn/Lobby', deathLogs: 'Death/Events', errLogs: 'Errors/Warnings', clearBtn: 'Clear',
    cmdPlaceholder: 'Type admin console command and press Enter', sendBtn: 'Send',
    worldSettings: 'World & Server Settings', serverConfigTitle: 'Server Identity & Automated Backups',
    srvNameLabel: 'Server Name', srvPassLabel: 'Server Password', autoBackupLabel: 'Automated Backup Engine',
    backupFreqLabel: 'Backup Frequency', retentionLabel: 'Local Snapshots Retention',
    saveServerBtn: 'Save Server Config', saveRestartBtn: 'Save & Restart Server',
    modifiersTitle: 'Gameplay Modifiers', resourceMod: 'Resource Rate', portalMod: 'Portal Rules',
    raidMod: 'Enemy Raids', combatMod: 'Combat Difficulty', deathMod: 'Death Penalty',
    saveModsBtn: 'Save Modifiers', unsavedBar: 'changes pending. Active after next server restart.',
    discardBtn: 'Discard Changes', saveBtn: 'Save',
    activeWorld: 'Active World', snapshotsCount: 'Snapshots', createSnapBtn: 'Create Snapshot Now',
    uploadWorldBtn: 'Upload World Save (.db / .fwl / .zip)', timeCol: 'Timestamp', nameCol: 'Name / Tag',
    sizeCol: 'Size', locCol: 'Storage', downloadBtn: 'Download .zip', rollbackBtn: 'Rollback',
    noSnaps: 'No snapshots recorded yet.',
    modsTitle: 'Installed BepInEx Plugins', uploadModBtn: 'Upload Mod (.dll / .zip)',
    editConfigBtn: 'Edit Config', modRestartNotice: 'Mod toggles and additions take effect after server restart.',
    settingsTitle: 'System Settings', discordCardTitle: 'Discord Webhook Integration',
    addWebhookBtn: '+ Add Webhook', githubCardTitle: 'GitHub Cloud Sync & Release Storage',
    configGithubBtn: 'Configure GitHub', securityCardTitle: 'Admin Security Credentials',
    changePassBtn: 'Change Password', testBtn: 'Test Connection', saveConfigBtn: 'Save Settings',
    cancelBtn: 'Cancel', confirmBtn: 'Confirm', copied: 'Copied',
    tabs: { overview: 'Overview', console: 'Console', world: 'World', players: 'Players', snap: 'Snapshots', mods: 'Mods', settings: 'Settings' }
  },
  id: {
    restart: 'Restart', restart1m: 'Restart, hitung mundur 1m', restart5m: 'Restart, hitung mundur 5m',
    forceKill: 'Kill Paksa & Restart', saveWorld: 'Simpan Dunia', stop: 'Stop Server', start: 'Start Server',
    running: 'RUNNING', stopped: 'STOPPED', rebooting: 'REBOOTING',
    active: 'ACTIVE', stall: 'STALL', uptime: 'UPTIME', logout: 'Keluar',
    joinCode: 'Join Code', copyCode: 'Salin Kode', copyIp: 'Salin IP', copyPass: 'Salin Password',
    broadcastDiscord: 'Siarkan ke Discord', serverPassword: 'Password Server', serverName: 'Nama Server',
    registeredPlayFab: 'Terdaftar di PlayFab', directJoin: 'Direct Join', hostVitals: 'Vitals Host',
    troubleshootTitle: 'Server Tidak Muncul di Valheim?',
    step1Title: 'Periksa Lobi PlayFab', step1Desc: 'Cek apakah server masih terdaftar di matchmaking Azure.', checkBtn: 'Periksa',
    step2Title: 'Reset Lobi', step2Desc: 'Buka ulang socket matchmaking, join code baru dikirim otomatis.', resetBtn: 'Reset Lobi',
    step3Title: 'Restart Paksa', step3Desc: 'Jika engine hang: simpan dunia, kill proses dan jalankan ulang seketika.', killBtn: 'Kill & Restart',
    onlinePlayers: 'Pemain Bertualang', charCol: 'Karakter', steamCol: 'Steam ID', sessionCol: 'Online', pingCol: 'Status', actCol: 'Aksi',
    latestLogs: 'Log Terbaru', openConsole: 'Buka Console', noPlayers: 'Tidak ada pemain online.',
    allLogs: 'Semua', connLogs: 'Koneksi/Lobi', deathLogs: 'Kematian/Event', errLogs: 'Error/Warning', clearBtn: 'Bersihkan',
    cmdPlaceholder: 'Ketik perintah admin console lalu Enter', sendBtn: 'Kirim',
    worldSettings: 'Pengaturan Dunia & Server', serverConfigTitle: 'Identitas Server & Auto-Backup',
    srvNameLabel: 'Nama Server', srvPassLabel: 'Password Server', autoBackupLabel: 'Auto-Backup Terjadwal',
    backupFreqLabel: 'Frekuensi Backup', retentionLabel: 'Batas Simpan Snapshot Lokal',
    saveServerBtn: 'Simpan Konfigurasi Server', saveRestartBtn: 'Simpan & Restart Server',
    modifiersTitle: 'Modifier Aturan Dunia', resourceMod: 'Pengali Sumber Daya', portalMod: 'Regulasi Portal',
    raidMod: 'Serbuan Musuh (Raid)', combatMod: 'Tingkat Kesulitan Pertarungan', deathMod: 'Hukuman Kematian',
    saveModsBtn: 'Simpan Modifier', unsavedBar: 'perubahan belum diterapkan. Aktif setelah restart.',
    discardBtn: 'Batalkan', saveBtn: 'Simpan',
    activeWorld: 'Save Aktif', snapshotsCount: 'Backup', createSnapBtn: 'Buat Snapshot Sekarang',
    uploadWorldBtn: 'Unggah Save Dunia (.db / .fwl / .zip)', timeCol: 'Waktu', nameCol: 'Nama / Tag',
    sizeCol: 'Ukuran', locCol: 'Lokasi', downloadBtn: 'Unduh .zip', rollbackBtn: 'Pulihkan',
    noSnaps: 'Belum ada file backup.',
    modsTitle: 'Mod Terpasang (BepInEx)', uploadModBtn: 'Unggah Mod (.dll / .zip)',
    editConfigBtn: 'Edit Config', modRestartNotice: 'Perubahan mod aktif penuh setelah server direstart.',
    settingsTitle: 'Pengaturan Sistem', discordCardTitle: 'Integrasi Webhook Discord',
    addWebhookBtn: '+ Tambah Webhook', githubCardTitle: 'Sinkronisasi Cloud GitHub Release',
    configGithubBtn: 'Konfigurasi GitHub', securityCardTitle: 'Keamanan Admin Panel',
    changePassBtn: 'Ganti Password', testBtn: 'Uji Koneksi', saveConfigBtn: 'Simpan Pengaturan',
    cancelBtn: 'Batal', confirmBtn: 'Konfirmasi', copied: 'Tersalin',
    tabs: { overview: 'Overview', console: 'Console', world: 'World', players: 'Pemain', snap: 'Snapshots', mods: 'Mods', settings: 'Settings' }
  }
};

const t = k => TXT[LANG][k] || k;

const S = {
  st: 'running',
  up: 0,
  cpu: [],
  ram: [],
  disk: 0,
  code: '—',
  lobby: false,
  ip: '—',
  pass: '••••••',
  passReal: '',
  showPass: false,
  srvName: 'BarudakValheim',
  tab: 'overview',
  flt: 'all',
  chk: '',
  players: [],
  logs: [],
  world: {},
  saved: {},
  serverConf: { name: '', password: '', auto_backup_enabled: true, auto_backup_interval_hours: 6, retention_count: 10 },
  serverConfSaved: {},
  snaps: [],
  admins: [],
  bans: [],
  mods: [],
  settings: { server: {}, discord_webhooks: [], github: {} }
};

for (let i = 0; i < 40; i++) {
  S.cpu.push(0);
  S.ram.push(0);
}

const WO = [
  ['resources', 'resourceMod', [['1x', 'normal'], ['1.5x', 'more'], ['2x', 'muchmore'], ['3x', 'extreme']]],
  ['portals', 'portalMod', [['Normal', 'normal'], ['Casual', 'casual'], ['Hard', 'hard'], ['None', 'none']]],
  ['raids', 'raidMod', [['None', 'none'], ['MuchLess', 'muchless'], ['PlayerEvents', 'playerevents'], ['Normal', 'normal'], ['MuchMore', 'muchmore']]],
  ['combat', 'combatMod', [['V.Easy', 'veryeasy'], ['Easy', 'easy'], ['Normal', 'normal'], ['Hard', 'hard'], ['V.Hard', 'veryhard']]],
  ['death_penalty', 'deathMod', [['Casual', 'casual'], ['Normal', 'normal'], ['Hard', 'hard'], ['Hardcore', 'hardcore']]]
];

const hm = s => {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? h + 'h ' + m + 'm' : m + 'm ' + (s % 60) + 's';
};

const FL = { all: null, conn: ['CONN', 'INFO'], death: ['DEATH'], err: ['WARN', 'ERROR'] };

function lines(f, n) {
  let a = S.logs;
  if (f && FL[f]) a = a.filter(x => FL[f].includes(x[1]));
  if (n) a = a.slice(-n);
  return a.map(x => `<div><span class=t>${x[0]}</span> <span class=${x[1]}>[${x[1]}]</span> ${x[2]}</div>`).join('') || '<div class=INFO>No logs recorded.</div>';
}

const spark = (a, c, mx) => {
  const w = 100, h = 26, M = mx || Math.max(...a, 1) * 1.2;
  const p = a.map((v, i) => (i / (a.length - 1) * w).toFixed(1) + ',' + (h - v / M * h).toFixed(1)).join(' ');
  return `<svg class=sl viewBox="0 0 100 26" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
};

const post = (p, b) => fetch(API + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
const del = (p, b) => fetch(API + p, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });

function toast(m, e) {
  const d = document.createElement('div');
  d.textContent = m;
  if (e) d.className = 'e';
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 3500);
}

function ask(title, body, lab, fn, dng) {
  const o = $('#ov');
  o.hidden = 0;
  o.innerHTML = `<div class="mod ${dng ? 'dng' : ''}"><h3>${title}</h3><div class=mut>${body}</div><div class=row style="justify-content:flex-end"><button class=btn data-a=x>${t('cancelBtn')}</button><button class="btn ${dng ? 'd' : 'p'}" id=ok>${lab}</button></div></div>`;
  $('#ok').onclick = () => { o.hidden = 1; fn(); };
}

async function act(a, d) {
  try {
    const r = await post('/api/actions/execute', { action: a, delay_seconds: d || 0 });
    if (r.status === 401) { window.location.href = '/login'; return; }
    const j = await r.json();
    if (j.ok) {
      toast(j.message || 'Action executed: ' + a);
    } else {
      toast(j.message || 'Execution failed for ' + a, 1);
    }
  } catch (err) {
    toast('API connection error', 1);
  }
  setTimeout(poll, 800);
}

function power() {
  const b = S.st === 'rebooting', off = S.st === 'stopped';
  if (off) return `<button class="btn p" data-a=start>${t('start')}</button>`;
  const x = b ? 'disabled' : '';

function render() {
  nav();
  $('#mn').innerHTML = V[S.tab]();
  const c = $('#term');
  if (c) c.scrollTop = 1e9;
}

async function fetchLogs() {
  try {
    const r = await fetch(API + '/api/logs?count=120');
    if (r.ok) {
      const data = await r.json();
      S.logs = data.map(x => [x.timestamp, x.level, x.message]);
      const tEl = $('#term');
      if (tEl) { tEl.innerHTML = lines(S.flt === 'all' || S.tab === 'overview' ? null : S.flt); tEl.scrollTop = 1e9; }
      const y = $('#tail');
      if (y) y.innerHTML = lines(null, 6);
    }
  } catch (e) {}
}

async function fetchPlayers() {
  try {
    const r = await fetch(API + '/api/players');
    if (r.ok) {
      const d = await r.json();
      S.admins = d.admins || [];
      S.bans = d.bans || [];
      if (S.tab === 'players') render();
    }
  } catch (e) {}
}

async function fetchWorld() {
  try {
    const r = await fetch(API + '/api/modifiers');
    if (r.ok) {
      const d = await r.json();
      S.world = d;
      S.saved = { ...d };
      if (S.tab === 'world') render();
    }
  } catch (e) {}
}

async function fetchSnapshots() {
  try {
    const r = await fetch(API + '/api/snapshots');
    if (r.ok) {
      S.snaps = await r.json();
      if (S.tab === 'snap') render();
    }
  } catch (e) {}
}

async function fetchMods() {
  try {
    const r = await fetch(API + '/api/mods');
    if (r.ok) {
      S.mods = await r.json();
      if (S.tab === 'mods') render();
    }
  } catch (e) {}
}

async function fetchSettings() {
  try {
    const r = await fetch(API + '/api/settings');
    if (r.ok) {
      S.settings = await r.json();
      if (S.settings.server) {
        S.serverConf = { ...S.settings.server };
        S.serverConfSaved = { ...S.settings.server };
      }
      if (S.tab === 'settings') render();
    }
  } catch (e) {}
}

async function poll() {
  try {
    const r = await fetch(API + '/api/status');
    if (r.status === 401) { window.location.href = '/login'; return; }
    if (!r.ok) throw 0;
    const j = await r.json();
    S.st = j.server.status;
    S.up = j.server.uptime_seconds;
    S.cpu.push(j.server.cpu_usage_pct);
    S.ram.push(j.server.memory_used_mb / (j.server.memory_total_mb || 1) * 100);
    S.cpu.shift();
    S.ram.shift();
    S.disk = j.server.disk_free_gb;
    S.lobby = j.playfab.is_active;
    S.code = j.playfab.join_code;
    S.ip = j.playfab.ip + ':' + j.playfab.port;
    if (j.server.password) S.passReal = j.server.password;
    if (j.server.name) S.srvName = j.server.name;
    S.players = j.players.map(p => ({
      n: p.character_name,
      id: p.steam_id,
      t: p.session_duration_str,
      ping: 'Online',
      adm: p.is_admin
    }));
  } catch (e) {}

  const u = $('#upt');
  if (u) u.textContent = t('uptime') + ' ' + (S.st === 'running' ? hm(S.up) : '—');
  const v = $('#vit');
  if (v) v.innerHTML = vit();
  head();

  fetchLogs();
  if (S.tab === 'players') fetchPlayers();
  if (S.tab === 'snap') fetchSnapshots();
  if (S.tab === 'mods') fetchMods();
  if (S.tab === 'settings') fetchSettings();
  if (S.tab === 'world' && Object.keys(S.world).length === 0) fetchWorld();
}

$('#btn-lang').onclick = () => {
  LANG = LANG === 'en' ? 'id' : 'en';
  localStorage.setItem('thorpedo_lang', LANG);
  head();
  render();
};

document.addEventListener('click', e => {
  const m = $('#menu');
  if (m && !e.target.closest('.split')) m.hidden = 1;
  const lBtn = e.target.closest('[data-l]');
  if (lBtn) {
    LANG = lBtn.dataset.l;
    localStorage.setItem('thorpedo_lang', LANG);
    head();
    render();
    return;
  }
  const tEl = e.target.closest('[data-t]');
  if (tEl) {
    S.tab = tEl.dataset.t;
    if (S.tab === 'players') fetchPlayers();
    if (S.tab === 'world') { fetchWorld(); fetchSettings(); }
    if (S.tab === 'snap') fetchSnapshots();
    if (S.tab === 'mods') fetchMods();
    if (S.tab === 'settings') fetchSettings();
    if (S.tab === 'console') fetchLogs();
    return render();
  }

  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, D = el.dataset, pl = S.players.length;

  const rs = d => d === 0 && pl ? ask('Restart Server Now?', `${pl} players are online and will be disconnected. World will be saved first.`, 'Restart', () => act('restart_graceful', 0)) : act('restart_graceful', d);
  const kill = () => ask('Force Kill Server Process?', 'Immediately sends SIGKILL (-9). Use if server is hanging unresponsive. Unsaved progress since last disk sync will be lost.', 'Kill & Restart', () => act('restart_force'), 1);

  ({
    menu: () => { m.hidden = !m.hidden; },
    rs0: () => rs(0),
    rs60: () => rs(60),
    rs300: () => rs(300),
    kill,
    start: () => act('start'),
    save: () => act('force_save'),
    stop: () => ask('Stop Dedicated Server?', `Server process will be terminated until you click Start. ${pl} players will be disconnected.`, 'Stop', () => act('stop'), 1),
    x: () => { $('#ov').hidden = 1; },
    togpass: () => { S.showPass = !S.showPass; render(); },
    cp: () => navigator.clipboard?.writeText(D.v).then(() => { el.textContent = t('copied'); setTimeout(render, 1500); }),
    disc: () => act('broadcast_discord'),
    chk: async () => {
      try {
        const r = await post('/api/actions/execute', { action: 'check_playfab' });

// World upload file handler
$('#file-world').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  toast('Uploading world save archive: ' + file.name + '...');
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch(API + '/api/snapshots/upload-world', { method: 'POST', body: fd });
    const j = await res.json();
    if (j.ok) {
      toast(j.message);
      fetchSnapshots();
    } else {
      toast(j.message || 'World upload failed', 1);
    }
  } catch (err) {
    toast('World upload network failure', 1);
  }
  e.target.value = '';
});

// Mod upload file handler
$('#file-mod').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  toast('Uploading mod plugin: ' + file.name + '...');
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch(API + '/api/mods/upload', { method: 'POST', body: fd });
    const j = await res.json();
    if (j.ok) {
      toast(j.message);
      fetchMods();
      ask('Mod Installed: ' + file.name, 'Do you want to restart the server now to activate the new mod?', 'Restart Now', () => act('restart_graceful', 0));
    } else {
      toast(j.message || 'Mod upload failed', 1);
    }
  } catch (err) {
    toast('Mod upload network failure', 1);
  }
  e.target.value = '';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'ci') {
    const btn = document.querySelector('[data-a=send]');
    if (btn) btn.click();
  }
  if (e.key === 'Escape') {
    $('#ov').hidden = 1;
  }
});

let ps = '';
setInterval(async () => {
  await poll();
  const k = S.st + S.lobby + S.players.length;
  if (k !== ps) {
    ps = k;
    head();
    if (S.tab === 'overview' || S.tab === 'players') render();
    else nav();
  }
}, 3000);

head();
render();
poll();
fetchWorld();
fetchPlayers();
fetchSnapshots();
fetchMods();
fetchLogs();
fetchSettings();
</script></body></html>
