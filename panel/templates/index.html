<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thorpedo · Valheim Control</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1014;--surf:#151922;--surf2:#1B2130;--line:#262E3C;--line-soft:#1F2734;
  --txt:#E9EEF6;--mut:#8D9AAB;--dim:#5C6879;
  --amber:#D97706;--amber-hi:#F0900F;--ok:#12A150;--warn:#D9A21B;--bad:#E5484D;--info:#3B82C4;
  --ink:#10120F;--mono:'JetBrains Mono',ui-monospace,monospace;
  --r:3px;--r-lg:5px;color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:13px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:196px 1fr;grid-template-rows:56px 1fr;height:100vh;overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

/* progress */
#progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--amber);transform:scaleX(0);transform-origin:0 50%;transition:transform .25s ease;z-index:999}
#progress.on{transform:scaleX(1);animation:pr 1.1s infinite ease-in-out}
@keyframes pr{0%{opacity:.45}50%{opacity:1}100%{opacity:.45}}

/* header */
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surf);min-width:0}
.brand{font:700 14px var(--mono);letter-spacing:.16em;white-space:nowrap}
.brand b{color:var(--amber)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--mono);letter-spacing:.07em;padding:4px 8px;border:1px solid var(--line);border-radius:var(--r);color:var(--mut);white-space:nowrap;background:transparent;cursor:default}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--mut);flex:none}
.chip.running{color:var(--ok);border-color:#185235}.chip.running i{background:var(--ok)}
.chip.stopped{color:var(--bad);border-color:#5A2226}.chip.stopped i{background:var(--bad)}
.chip.rebooting,.chip.crashed{color:var(--warn);border-color:#5A451A}.chip.rebooting i,.chip.crashed i{background:var(--warn)}
.chip.warn{color:var(--warn);border-color:#5A451A}.chip.warn i{background:var(--warn)}
.chip.ok{color:var(--ok);border-color:#185235}.chip.ok i{background:var(--ok)}
.chip.bad{color:var(--bad);border-color:#5A2226}.chip.bad i{background:var(--bad)}
.chip.update{color:var(--amber);border-color:#6B3D08;background:#2A1C05;cursor:pointer}
.chip.update:hover{background:#3A2707}
button.chip{font-family:var(--mono)}
.uptime{font:11px var(--mono);color:var(--dim);white-space:nowrap}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}

/* nav */
nav{border-right:1px solid var(--line);background:var(--surf);display:flex;flex-direction:column;justify-content:space-between;padding:10px 0;overflow:hidden}
.nav-links{display:flex;flex-direction:column}
nav a{display:flex;align-items:center;gap:8px;padding:9px 18px;color:var(--mut);cursor:pointer;border-left:2px solid transparent;text-decoration:none;font-size:12.5px}
nav a:hover{color:var(--txt);background:#FFFFFF06}
nav a.on{color:var(--txt);border-color:var(--amber);background:var(--bg)}
nav a span.n{margin-left:auto;font:10.5px var(--mono);color:var(--dim)}
nav a.on span.n{color:var(--amber)}
nav a span.dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.lang-box{padding:10px 14px}
.lang-pill{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:2px}
.lang-opt{flex:1;background:none;border:0;color:var(--mut);font:600 10.5px Inter,sans-serif;padding:5px 2px;cursor:pointer;border-radius:2px}
.lang-opt:hover{color:var(--txt)}
.lang-opt.active{background:var(--bg);color:var(--amber)}

/* main */
main{overflow-y:auto;padding:22px 26px 80px;min-width:0}
h2{font:700 10.5px var(--mono);letter-spacing:.14em;color:var(--mut);text-transform:uppercase;display:flex;align-items:center;gap:12px;margin:0 0 10px}
h2::after{content:"";flex:1;height:1px;background:var(--line-soft)}
h2 .aside{text-transform:none;letter-spacing:0;font:500 11px Inter;color:var(--dim)}
section{margin-bottom:26px}
.box{border:1px solid var(--line);background:var(--surf);border-radius:var(--r-lg);overflow:hidden}
.box.pad{padding:18px 20px}
.grid-2{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.mut{color:var(--mut)}.dim{color:var(--dim)}.mono{font-family:var(--mono)}
.s11{font-size:11px}.s12{font-size:12px}
hr.rule{border:0;border-top:1px solid var(--line-soft);margin:14px 0}

/* buttons */
.btn{font:600 12px Inter,sans-serif;color:var(--txt);background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover:not(:disabled){border-color:#3A4657;background:#202836}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.p{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:700}
.btn.p:hover:not(:disabled){background:var(--amber-hi);border-color:var(--amber-hi)}
.btn.d{color:var(--bad);border-color:#4A2024;background:transparent}
.btn.d:hover:not(:disabled){background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:5px 8px}
.btn.ghost:hover:not(:disabled){color:var(--txt);background:#FFFFFF08;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.block{width:100%}
.btn.busy{pointer-events:none;opacity:.6}

/* power cluster */
.power{display:flex;align-items:center;gap:6px}
.split{position:relative;display:flex}
.split .btn:first-child{border-radius:var(--r) 0 0 var(--r)}
.split .btn.caret{border-radius:0 var(--r) var(--r) 0;border-left:1px solid #0000004D;padding:7px 7px}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:230px;background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);padding:4px;z-index:40;box-shadow:0 10px 28px #00000066}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--txt);padding:7px 9px;font:12px Inter;cursor:pointer;border-radius:2px}
.menu button:hover{background:#FFFFFF0D}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* join plaque */
.plaque{padding:18px 20px;display:flex;flex-direction:column;gap:13px}
.digits{display:flex;gap:6px}
.digits i{font:700 38px/1 var(--mono);font-style:normal;color:var(--amber);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 0;width:44px;text-align:center;letter-spacing:0}
.plaque.off .digits i{color:var(--dim);border-style:dashed}
.kvline{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.kvline b{color:var(--txt);font-family:var(--mono);font-size:12px}

/* vitals */
.vital{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line-soft)}
.vital:last-child{border-bottom:0}
.vital b{font:700 12.5px var(--mono);text-align:right;white-space:nowrap}
.spark{width:100%;height:24px;display:block}
.meter{height:5px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}

/* steps */
ol.steps{list-style:none;padding:0}
ol.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
ol.steps li:last-child{border-bottom:0}
ol.steps .n{font:700 12px var(--mono);color:var(--amber);border:1px solid var(--line);width:24px;height:24px;display:grid;place-items:center;border-radius:var(--r)}
ol.steps p{font-size:12px;color:var(--mut);margin-top:2px}
.step-result{font:11.5px var(--mono);color:var(--ok);margin-top:4px}
.step-result.bad{color:var(--bad)}

/* tables */
table{width:100%;border-collapse:collapse}
th{font:700 9.5px var(--mono);letter-spacing:.11em;color:var(--dim);text-align:left;padding:9px 16px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FFFFFF05}
td.r,th.r{text-align:right}
td .row{justify-content:flex-end}
.empty{padding:22px 18px;color:var(--dim);font-size:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.empty b{color:var(--mut);font-weight:600}
.tag{font:700 9.5px var(--mono);letter-spacing:.07em;padding:2px 6px;border:1px solid var(--line);color:var(--mut);border-radius:2px;white-space:nowrap;display:inline-block}
.tag.ok{color:var(--ok);border-color:#185235}
.tag.bad{color:var(--bad);border-color:#5A2226}
.tag.warn{color:var(--warn);border-color:#5A451A}
.tag.amber{color:var(--amber);border-color:#6B3D08}
.tag.info{color:var(--info);border-color:#1E3F5C}

/* console */
.term{background:#090B0E;border:1px solid var(--line);border-radius:var(--r-lg);font:11.5px/1.7 var(--mono);padding:13px 15px;overflow-y:auto;height:calc(100vh - 268px);min-height:220px}
.term.mini{height:auto;max-height:150px;border-radius:0;border:0;border-top:1px solid var(--line)}
.term div{white-space:pre-wrap;word-break:break-word}
.term .t{color:#4C5566}
.INFO{color:var(--mut)}.CONN{color:var(--ok)}.DEATH{color:var(--warn)}.WARN{color:var(--warn)}.ERROR{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--surf);color:var(--mut);border:0;border-right:1px solid var(--line);padding:6px 11px;font:12px Inter;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--txt)}
.seg button.on{background:#2A1C05;color:var(--amber);font-weight:600}
.cmd{display:flex;margin-top:10px;border:1px solid var(--line);background:#090B0E;border-radius:var(--r)}
.cmd span{padding:9px 0 0 13px;color:var(--amber);font:700 13px var(--mono)}
.cmd input{flex:1;background:none;border:0;color:var(--txt);font:12.5px var(--mono);padding:9px 11px;outline:0}
.cmd .btn{border:0;border-left:1px solid var(--line);border-radius:0 var(--r) var(--r) 0}

/* list rows */
.list>div{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
.list>div:last-child{border-bottom:0}
.list small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}

/* forms */
input.in,select.in,textarea.in{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:7px 9px;font:12px var(--mono);border-radius:var(--r);outline:0;width:100%}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--amber)}
input.in::placeholder,textarea.in::placeholder{color:var(--dim);opacity:.7}
textarea.in{line-height:1.5;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--mut)}
.field.inline{flex-direction:row;align-items:center;gap:9px;color:var(--txt)}
.hint{font-size:10.5px;color:var(--dim);line-height:1.5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* switch */
.tog{width:34px;height:19px;border-radius:10px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
/* The visual switch stays small; this overlay is the touch target. */
.tog::before{content:"";position:absolute;inset:-11px -8px;border-radius:14px}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:var(--txt);transition:left .15s ease}
.tog[aria-checked="true"]{background:var(--ok)}
.tog[aria-checked="true"]::after{left:18px}

/* cards */
.card{border:1px solid var(--line);background:var(--surf);border-radius:var(--r-lg);padding:17px 19px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.card-head h3{font:700 12px var(--mono);letter-spacing:.05em;color:var(--txt)}
.card-head small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;font-family:Inter;letter-spacing:0;font-weight:400}

/* callout */
.callout{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid #5A451A;background:#221905;border-radius:var(--r-lg);margin-bottom:18px}
.callout.bad{border-color:#5A2226;background:#220D0E}
.callout b{font:600 12px Inter}
.callout .grow{flex:1}

/* modal */
.overlay{position:fixed;inset:0;background:#05060AE6;display:grid;place-items:center;z-index:60;padding:16px}
.overlay[hidden]{display:none}
.modal{width:540px;max-width:100%;max-height:88vh;overflow-y:auto;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px}
.modal.danger{border-color:#5A2226}
.modal h3{font:700 14px var(--mono)}
.modal .body{color:var(--mut);font-size:12.5px;line-height:1.6}
.modal .body code{font-family:var(--mono);color:var(--txt);background:var(--bg);padding:1px 4px;border-radius:2px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
.modal .actions.split-actions{justify-content:space-between;flex-wrap:wrap}
.modal.wide{width:720px}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(420px,90vw)}
#toasts div{background:var(--surf2);border:1px solid var(--line);border-left:3px solid var(--ok);padding:9px 13px;font-size:12px;border-radius:var(--r);box-shadow:0 8px 22px #00000055}
#toasts div.err{border-left-color:var(--bad)}
#toasts div.warn{border-left-color:var(--warn)}

/* version panel */
.ver-hero{display:flex;align-items:center;gap:16px;padding:18px 20px;flex-wrap:wrap}
.ver-num{font:700 26px var(--mono);letter-spacing:.02em}
.ver-arrow{color:var(--dim);font:600 18px var(--mono)}
.ver-detail{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:11.5px;padding:16px 20px;border-top:1px solid var(--line-soft)}
.ver-detail dt{color:var(--dim);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.ver-detail dd{color:var(--txt);font-family:var(--mono);font-size:11.5px;word-break:break-word}

@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  header{grid-column:1;flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0}
  nav a{border-left:0;border-bottom:2px solid transparent;padding:10px 13px;white-space:nowrap}
  nav a.on{border-color:var(--amber)}
  .nav-links{flex-direction:row}
  .lang-box{display:none}
  main{padding:16px 14px 80px}
  .grid-2,.grid-3,.form-grid{grid-template-columns:1fr}
  .term{height:52vh}
  .ver-detail{grid-template-columns:1fr}
  /* Touch targets: 40px minimum so a thumb hits the control it aimed at. */
  .btn{padding:10px 13px;min-height:40px}
  .btn.sm,.btn.ghost{padding:9px 11px;min-height:38px}
  .seg button{padding:10px 12px;min-height:40px}
  .lang-opt{padding:8px 2px}
  .tog{width:44px;height:26px}.tog::after{width:20px;height:20px}.tog[aria-checked="true"]::after{left:21px}
  .tog::before{inset:-9px -6px}
  .chip{min-height:32px;padding:7px 10px}
  .menu button{padding:11px 10px}
  .card-head .row{width:100%}
  .card-head .row .btn{flex:1}
  nav a{padding:12px 14px}
  th,td{padding:11px 12px}
  .vital{grid-template-columns:48px 1fr auto;padding:12px 14px}
  .digits i{width:36px;font-size:30px}
}
</style></head>
<body>
<div id="progress"></div>
<div id="app">
  <header id="hd"></header>
  <nav>
    <div class="nav-links" id="nl"></div>
    <div class="lang-box" id="lb"></div>
  </nav>
  <main id="mn"></main>
</div>
<div class="overlay" id="ov" hidden></div>
<div id="toasts"></div>
<input type="file" id="file-world" accept=".db,.db2,.fwl,.fwl2,.modifiers,.zip" hidden>
<input type="file" id="file-mod" accept=".dll,.zip" hidden>

/* ---------- helpers ---------- */

function fmtUptime(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + m + 'm';
  return m + 'm ' + (sec % 60) + 's';
}
function fmtBytes(mb) { return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : mb.toFixed(0) + ' MB'; }
function timeAgo(ts) {
  if (!ts) return t('never');
  const diff = Math.floor(Date.now() / 1000 - ts);
  if (diff < 60) return diff + 's';
  if (diff < 3600) return Math.floor(diff / 60) + 'm';
  return Math.floor(diff / 3600) + 'h';
}
function toast(msg, kind) {
  const d = document.createElement('div');
  d.textContent = msg;
  if (kind === 'err') d.className = 'err';
  if (kind === 'warn') d.className = 'warn';
  $('#toasts').appendChild(d);
  setTimeout(() => d.remove(), 4800);
}
function progress(on) { $('#progress').classList.toggle('on', !!on); }
async function api(path, opts) {
  const res = await fetch(API + path, opts);
  if (res.status === 401) { window.location.href = '/login'; throw new Error('unauthorized'); }
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) {
    const msg = (data && (data.message || data.detail)) || ('HTTP ' + res.status);
    throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
  }
  return data;
}
const postJSON = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
const deleteJSON = (path, body) => api(path, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

function confirmDialog(o) {
  return new Promise(resolve => {
    const ov = $('#ov');
    ov.hidden = false;
    ov.innerHTML = `<div class="modal ${o.danger ? 'danger' : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">
      ${o.tag ? `<span class="chip ${o.danger ? 'bad' : 'warn'}" style="align-self:flex-start">${esc(o.tag)}</span>` : ''}
      <h3>${esc(o.title)}</h3>
      <div class="body">${o.body}</div>
      ${o.checkbox ? `<label class="field inline"><input type="checkbox" id="dlg-check" ${o.checkbox.checked ? 'checked' : ''}> ${esc(o.checkbox.label)}</label>` : ''}
      <div class="actions">
        <button class="btn" data-dlg="cancel">${t('cancel')}</button>
        <button class="btn ${o.danger ? 'd' : 'p'}" data-dlg="ok">${esc(o.confirm || t('confirm'))}</button>
      </div></div>`;
    const done = v => { ov.hidden = true; ov.innerHTML = ''; resolve(v); };
    $('[data-dlg=cancel]', ov).onclick = () => done(null);
    $('[data-dlg=ok]', ov).onclick = () => done({ checked: o.checkbox ? $('#dlg-check').checked : undefined });
    ov.onclick = e => { if (e.target === ov) done(null); };
    $('[data-dlg=ok]', ov).focus();
  });
}

const spark = (arr, color, max) => {
  const w = 100, h = 26, top = max || Math.max(...arr, 1) * 1.15;
  const pts = arr.map((v, i) => (i / (arr.length - 1) * w).toFixed(1) + ',' + (h - Math.min(v, top) / top * h).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
};

function logLines(filter, max) {
  let arr = S.logs.slice();
  if (S.clearKey) {
    const idx = arr.map(x => x.k).lastIndexOf(S.clearKey);
    if (idx >= 0) arr = arr.slice(idx + 1);
  }
  if (filter && LOG_FILTER[filter]) arr = arr.filter(x => LOG_FILTER[filter].includes(x.level));
  if (max) arr = arr.slice(-max);
  if (!arr.length) return `<div class="dim">No lines here yet. New engine output appears as it happens.</div>`;
  return arr.map(x => `<div><span class="t">${esc(x.ts)}</span> <span class="${esc(x.level)}">${esc(x.level)}</span> ${esc(x.msg)}</div>`).join('');
}

/* ---------- render ---------- */

function captureFormState() {
  // Re-rendering the World tab rebuilds its inputs, so keep whatever was typed.
  const name = $('#conf-name'), pass = $('#conf-pass'), freq = $('#conf-freq'), ret = $('#conf-ret');
  if (name) S.conf.name = name.value;
  if (pass) S.conf.password = pass.value;
  if (freq) S.conf.auto_backup_interval_hours = parseInt(freq.value, 10);
  if (ret) S.conf.retention_count = parseInt(ret.value, 10);
}

function render() {
  renderNav();
  const main = $('#mn');
  const scroll = main.scrollTop;
  if (S.tab === 'world') captureFormState();
  main.innerHTML = V[S.tab]();
  if (S.tab === 'console' || S.tab === 'overview') main.scrollTop = scroll;
  if (S.tab === 'console') {
    const term = $('#term');
    if (term) term.scrollTop = term.scrollHeight;
    const input = $('#cmd-input');
    if (input) input.focus();
  }
  updateHeader();
}

function go(tab) {
  S.tab = tab;
  if (tab === 'players') fetchPlayers();
  if (tab === 'world') { if (!S.loaded.world || !unsavedCount()) fetchWorld(); }
  if (tab === 'snap') fetchSnapshots();
  if (tab === 'mods') fetchMods();
  if (tab === 'settings') fetchSettings();
  if (tab === 'system') fetchVersion(true);
  if (tab === 'console') fetchLogs();
  render();
}

/* ---------- data ---------- */

async function fetchStatus() {
  const j = await api('/api/status');
  S.st = j.server.status;
  S.up = j.server.uptime_seconds;
  S.cpu.push(j.server.cpu_usage_pct || 0); S.cpu.shift();
  S.ram.push(j.server.memory_total_mb ? (j.server.memory_used_mb / j.server.memory_total_mb * 100) : 0); S.ram.shift();
  S.memUsed = j.server.memory_used_mb || 0;
  S.memTotal = j.server.memory_total_mb || 0;
  S.diskFree = j.server.disk_free_gb || 0;
  S.diskTotal = j.server.disk_total_gb || 0;
  S.nextBackup = j.server.next_backup_in_seconds;
  S.snapCount = j.snapshot_count || 0;
  S.playfab = !!(j.playfab && j.playfab.is_active);
  S.code = (j.playfab && j.playfab.join_code) || '-';
  S.ip = (j.playfab && j.playfab.ip) || '-';
  S.port = (j.playfab && j.playfab.port) || 2456;
  if (j.server.password) S.pass = j.server.password;
  if (j.server.name) S.srvName = j.server.name;
  if (j.server.world_name) S.worldName = j.server.world_name;
  S.players = (j.players || []).map(p => ({
    n: p.character_name, id: p.steam_id || '-', t: p.session_duration_str || '-', adm: !!p.is_admin
  }));
}

async function fetchLogs() {
  const data = await api('/api/logs?count=200');
  const term = $('#term') || $('#tail');
  const stick = !term || term.scrollTop + term.clientHeight >= term.scrollHeight - 24;
  S.logs = (data || []).map(x => ({ ts: x.timestamp, level: x.level, msg: x.message, k: x.timestamp + '|' + x.level + '|' + x.message }));
  if (S.tab === 'console') {
    const el = $('#term');
    if (el) { el.innerHTML = logLines(S.filter); if (stick) el.scrollTop = el.scrollHeight; }
  } else if (S.tab === 'overview') {
    const el = $('#tail');
    if (el) { el.innerHTML = logLines(null, 7); if (stick) el.scrollTop = el.scrollHeight; }
  }
}

async function fetchPlayers() {
  const d = await api('/api/players');
  S.admins = d.admins || [];
  S.bans = d.bans || [];
  S.loaded.players = true;
  if (S.tab === 'players') render(); else renderNav();
}

async function fetchWorld() {
  const mods = await api('/api/modifiers');
  S.world = mods || {};
  S.saved = { ...S.world };
  const settings = await api('/api/settings');
  S.settings = settings;
  S.conf = { ...(settings.server || {}) };
  S.confSaved = { ...S.conf };
  S.loaded.world = true;
  if (S.tab === 'world') render();
}

async function fetchSnapshots() {
  S.snaps = await api('/api/snapshots');
  S.loaded.snap = true;
  if (S.tab === 'snap') render(); else renderNav();
}

async function fetchMods() {
  const list = await api('/api/mods');
  S.mods = {};
  (list || []).forEach(m => { S.mods[m.name] = m; });
  S.loaded.mods = true;
  if (S.tab === 'mods') render(); else renderNav();
}

async function fetchSettings() {
  S.settings = await api('/api/settings');
  S.conf = { ...(S.settings.server || {}) };
  S.confSaved = { ...S.conf };
  S.loaded.settings = true;
  if (S.tab === 'settings') render();
}

async function fetchVersion(showErrors) {
  try {
    const j = await api('/api/version');
    S.version = j;
    S.updateState = j.update_state || null;
    S.verAt = j.checked_at || Math.floor(Date.now() / 1000);
  } catch (e) {
    if (showErrors) toast('Version check failed: ' + e.message, 'err');
    S.version = S.version || { panel: { installed: '?', error: e.message }, game: {}, system: {} };
  }
  updateHeader();
  renderNav();
  if (S.tab === 'system') render();
  if (S.tab === 'overview') render();
}

/* ---------- actions ---------- */

async function act(action, el) {
  const D = el ? el.dataset : {};
  switch (action) {
    case 'power-menu': { const m = $('#power-menu'); if (m) m.hidden = !m.hidden; return; }
    case 'start': return runAction('start');
    case 'save-world': return runAction('force_save');
    case 'restart-now': return requestRestart(0);
    case 'restart-60': return requestRestart(60);
    case 'restart-300': return requestRestart(300);
    case 'kill': return requestKill();
    case 'stop': return requestStop();
    case 'probe': return probeLobby();
    case 'reset-lobby': return requestResetLobby();
    case 'broadcast': return runAction('broadcast_discord');
    case 'copy': {
      try { await navigator.clipboard.writeText(D.val || ''); toast(t('copied') + (D.val ? ': ' + D.val : '')); }
      catch (e) { toast('Clipboard blocked by the browser.', 'err'); }
      return;
    }
    case 'toggle-pass': S.showPass = !S.showPass; return render();
    case 'filter': S.filter = D.val; return render();
    case 'clear-log': S.clearKey = S.logs.length ? S.logs[S.logs.length - 1].k : null; return render();
    case 'send-cmd': return sendCommand();
    case 'mod-set': S.world[D.key] = D.val; return render();
    case 'mods-discard': S.world = { ...S.saved }; S.conf = { ...S.confSaved }; return render();
    case 'mods-save': return saveModifiers(false);
    case 'mods-save-restart': return saveModifiers(true);
    case 'toggle-autobackup': S.conf.auto_backup_enabled = !S.conf.auto_backup_enabled; return render();
    case 'save-conf': return saveServerConf(false);
    case 'save-conf-restart': return saveServerConf(true);
    case 'create-snap': return createSnapshot();
    case 'upload-world': $('#file-world').click(); return;
    case 'upload-mod': $('#file-mod').click(); return;
    case 'dl-snap': return downloadSnapshot(D.name);
    case 'rb-snap': return requestRollback(D.name, D.size);
    case 'del-snap': return requestDeleteSnapshot(D.name);
    case 'mod-toggle': return toggleMod(D.name, D.enabled === '1');
    case 'mod-delete': return requestDeleteMod(D.name);
    case 'mod-config': return openModConfig(D.name);
    case 'add-admin': return addToList('admins');
    case 'add-ban': return addToList('bans');
    case 'rm-admin': return removeFromList('admins', D.id);
    case 'rm-ban': return removeFromList('bans', D.id);
    case 'kick': return requestKick(D.name);
    case 'ban': return requestBan(D.name, D.id);
    case 'edit-discord': return openDiscordModal();
    case 'test-discord': return testDiscord();
    case 'edit-github': return openGithubModal();
    case 'edit-password': return openPasswordModal();
    case 'save-accpass': return saveAccessPassword();
    case 'toggle-accpass-visibility': {
      const i = $('#in-acc-pass');
      if (i) { const showing = i.type === 'text'; i.type = showing ? 'password' : 'text'; el.textContent = showing ? t('show') : t('hide'); }
      return;
    }
    case 'ver-check': return runVersionCheck();
    case 'ver-update-panel': return requestPanelUpdate();
    case 'ver-update-game': return requestGameUpdate();
    case 'goto-system': return go('system');
    default: return;
  }
}

async function runAction(action, delay) {
  progress(true);
  try {
    const j = await postJSON('/api/actions/execute', { action, delay_seconds: delay || 0 });
    toast(j.message || 'Done.', j.ok ? undefined : 'err');
  } catch (e) { toast(e.message, 'err'); }
  finally { progress(false); }
  setTimeout(poll, 700);
}

async function requestRestart(delay) {
  const n = S.players.length;
  const when = delay === 0 ? 'now' : delay === 60 ? 'in 1 minute' : 'in 5 minutes';
  const r = await confirmDialog({
    title: 'Restart the server ' + when + '?',
    body: `<p>The world is saved before the engine stops.</p>${n ? `<p style="margin-top:8px;color:var(--warn)">${n} player(s) are online and will be disconnected.</p>` : ''}${delay ? '<p style="margin-top:8px">An in-game countdown announcement is broadcast first.</p>' : ''}`,
    confirm: 'Restart',
    danger: !!n
  });
  if (!r) return;
  runAction('restart_graceful', delay);
}

async function requestKill() {
  const r = await confirmDialog({
    title: 'Force kill the server process?',
    tag: 'SIGKILL',
    body: `<p>The engine is terminated immediately with <code>SIGKILL</code>, then started again. Anything written since the last save is lost.</p>
           <p style="margin-top:8px">Use this only when a graceful restart hangs.${S.players.length ? ` <b style="color:var(--warn)">${S.players.length} player(s) online.</b>` : ''}</p>`,
    confirm: 'Kill & restart', danger: true
  });
  if (!r) return;
  runAction('restart_force');
}

async function requestStop() {
  const r = await confirmDialog({
    title: 'Stop the server?',
    body: `<p>The process is terminated and players are disconnected. Nobody can join until you press Start.</p>${S.players.length ? `<p style="margin-top:8px;color:var(--warn)">${S.players.length} player(s) online.</p>` : ''}`,
    confirm: 'Stop server', danger: true
  });
  if (!r) return;
  runAction('stop');
}

async function requestResetLobby() {
  const r = await confirmDialog({
    title: 'Reset the matchmaking lobby?',
    body: '<p>The server restarts gracefully and registers a new PlayFab join code. The old code stops working.</p>',
    confirm: 'Reset lobby'
  });
  if (!r) return;
  runAction('reset_playfab');
}

async function probeLobby() {
  progress(true);
  try {
    const j = await postJSON('/api/actions/execute', { action: 'check_playfab' });
    S.stepResult = j.message;
    S.stepOk = !!j.ok;
    toast(j.message, j.ok ? undefined : 'warn');
  } catch (e) { S.stepResult = e.message; S.stepOk = false; toast(e.message, 'err'); }
  finally { progress(false); }
  render();
}

async function sendCommand() {
  const input = $('#cmd-input');
  const cmd = input ? input.value.trim() : '';
  if (!cmd) return;
  try {
    const j = await postJSON('/api/console/command', { command: cmd });
    toast(j.message, j.ok ? undefined : 'err');
    if (j.ok) { input.value = ''; }
  } catch (e) { toast(e.message, 'err'); }
  fetchLogs();
}

async function saveModifiers(restart) {
  progress(true);
  try {
    const j = await postJSON('/api/modifiers', { modifiers: S.world, restart: !!restart });
    S.saved = { ...S.world };
    toast(j.message);
    if (restart) setTimeout(poll, 1200);
    render();
  } catch (e) { toast(e.message, 'err'); }
  finally { progress(false); }
}

async function saveServerConf(restart) {
  const name = $('#conf-name') ? $('#conf-name').value.trim() : S.conf.name;
  const pass = $('#conf-pass') ? $('#conf-pass').value : S.conf.password;
  const freq = parseInt($('#conf-freq') ? $('#conf-freq').value : S.conf.auto_backup_interval_hours, 10);
  const ret = parseInt($('#conf-ret') ? $('#conf-ret').value : S.conf.retention_count, 10);
  if (!name) return toast('Server name cannot be empty.', 'err');
  if (pass && pass.length < 5) return toast('Valheim requires a join password of at least 5 characters.', 'err');

  progress(true);
  try {
    const j = await postJSON('/api/server/config', {
      name, password: pass,
      auto_backup_enabled: !!S.conf.auto_backup_enabled,
      auto_backup_interval_hours: freq, retention_count: ret,
      restart: !!restart
    });
    S.conf = { ...S.conf, name, password: pass, auto_backup_interval_hours: freq, retention_count: ret };
    S.confSaved = { ...S.conf };
    toast(j.message);
    if (restart) setTimeout(poll, 1200);
    render();
  } catch (e) { toast(e.message, 'err'); }
  finally { progress(false); }
}

async function createSnapshot() {
  progress(true);
  try {
    toast('Packing the world into a new archive…');
    const j = await postJSON('/api/snapshots/create', {});
    if (j.ok) {
      toast(`Snapshot ${j.filename} created (${j.size_mb} MB).`);
      fetchSnapshots();
    } else {
      toast(j.message || 'Snapshot failed.', 'err');
    }
  } catch (e) { toast(e.message, 'err'); }
  finally { progress(false); }
}

function downloadSnapshot(name) {
  window.location.href = API + '/api/snapshots/download/' + encodeURIComponent(name);
}

async function requestRollback(name, size) {
  const r = await confirmDialog({
    title: 'Restore world from ' + name + '?',
    tag: 'DESTRUCTIVE',
    body: `<p>The current world is replaced with this archive (${esc(size || '?')} MB). The engine stops, the files are extracted, and the server starts again.</p>
           <p style="margin-top:8px">Everything built since this snapshot will be gone.</p>`,
    confirm: 'Restore world', danger: true,
    checkbox: { label: 'Save a safety snapshot of the current world first', checked: true }
  });
  if (!r) return;
  progress(true);
  try {
    toast('Restoring ' + name + '…');
    const j = await postJSON('/api/snapshots/rollback', { id: name, safety: r.checked });
    toast(j.message, j.ok ? undefined : 'err');
    if (j.ok) { fetchSnapshots(); setTimeout(poll, 1500); }
  } catch (e) { toast(e.message, 'err'); }
  finally { progress(false); }
}

async function requestDeleteSnapshot(name) {

function openModConfig(name) {
  const ov = $('#ov');
  ov.hidden = false;
  ov.innerHTML = `<div class="modal wide" role="dialog" aria-modal="true">
    <h3>${esc(name)} configuration</h3>
    <div class="s11 dim" id="cfg-file">Loading file…</div>
    <textarea class="in mono" id="cfg-text" style="height:300px;font-size:11.5px" spellcheck="false" aria-label="Config content"></textarea>
    <div class="row" style="justify-content:space-between">
      <span class="s11 dim">Written to BepInEx/config. Applies after restart.</span>
      <div class="row"><button class="btn" data-cfg="cancel">${t('cancel')}</button><button class="btn p" data-cfg="save">${t('saveSett')}</button></div>
    </div></div>`;

  const close = () => { ov.hidden = true; ov.innerHTML = ''; };
  ov.onclick = e => { if (e.target === ov) close(); };
  $('[data-cfg=cancel]', ov).onclick = close;
  $('[data-cfg=save]', ov).onclick = async () => {
    try {
      const j = await postJSON('/api/mods/config/' + encodeURIComponent(name), { content: $('#cfg-text').value });
      close();
      toast(j.message || 'Configuration saved.');
    } catch (e) { toast(e.message, 'err'); }
  };

  api('/api/mods/config/' + encodeURIComponent(name)).then(d => {
    const f = $('#cfg-file');
    if (f) f.textContent = 'BepInEx/config/' + d.file + (d.is_new ? ' (new file, not yet on disk)' : '');
    const tx = $('#cfg-text');
    if (tx) { tx.value = d.content || ''; tx.focus(); }
  }).catch(e => {
    const f = $('#cfg-file');
    if (f) f.textContent = 'Could not load config: ' + e.message;
  });
}

async function addToList(kind) {
  const input = $('#in-' + (kind === 'admins' ? 'admin' : 'ban'));
  const id = input ? input.value.trim() : '';
  if (!/^\d{17}$/.test(id)) return toast('SteamID must be 17 digits, e.g. 76561198000000000.', 'err');
  try {
    const j = await postJSON('/api/players/' + (kind === 'admins' ? 'admin' : 'ban'), { steam_id: id });
    toast(j.message, j.ok ? undefined : 'err');
    if (j.ok && input) input.value = '';
    fetchPlayers();
  } catch (e) { toast(e.message, 'err'); }
}

/* ---------- version actions ---------- */

async function runVersionCheck() {
  if (S.verBusy) return;
  S.verBusy = true;
  progress(true);
  try {
    const j = await api('/api/version/check', { method: 'POST' });
    S.version = j;
    S.updateState = j.update_state || null;
    S.verAt = j.checked_at || Math.floor(Date.now() / 1000);
    const p = j.panel, g = j.game;
    const note = p.error && g.error ? 'Both checks failed.' : p.update_available ? `Panel update available: ${p.installed} → ${p.latest}.` : g.update_available ? `Server build ${g.installed_buildid} → ${g.latest_buildid}.` : 'Everything is up to date.';
    toast(note, p.error && g.error ? 'err' : p.update_available || g.update_available ? 'warn' : undefined);
  } catch (e) { toast('Check failed: ' + e.message, 'err'); }
  finally { S.verBusy = false; progress(false); }
  updateHeader(); renderNav();
  if (S.tab === 'system') render();
}

async function requestPanelUpdate() {
  const p = S.version && S.version.panel;
  if (!p || !p.update_available) return;
  const r = await confirmDialog({
    title: `Update the panel to ${p.latest}?`,
    body: `<p>The current panel files are archived to <code>/config/panel_backups</code> first, then ${esc(p.installed)} is replaced with ${esc(p.latest)} from <code>${esc(p.repo)}@${esc(p.branch)}</code>.</p>
           <p style="margin-top:8px">The container restarts to load the new code. Because the game engine runs inside that container, the world is saved and the server goes down for roughly one to two minutes, then comes back on its own with a new join code.</p>`,
    confirm: 'Update & restart',
    danger: true,
    checkbox: { label: 'I understand the server will restart', checked: false }
  });
  if (!r) return;
  if (!r.checked) return toast('Tick the confirmation box to proceed.', 'warn');
  progress(true);
  try {
    const j = await postJSON('/api/version/update-panel', {});
    toast(j.message, j.ok ? undefined : 'err');
    if (j.ok) {
      waitForPanelReload();
    }
  } catch (e) { toast(e.message, 'err'); progress(false); }
}

async function waitForPanelReload() {
  toast('Panel restarting. This page reloads when it answers again.');
  const started = Date.now();
  const tick = async () => {
    try {
      const res = await fetch('/healthz', { cache: 'no-store' });
      if (res.ok) { window.location.reload(); return; }
    } catch (e) { /* still down */ }
    if (Date.now() - started > 90000) { progress(false); toast('Panel did not come back after 90s. Check container logs.', 'err'); return; }
    setTimeout(tick, 1500);
  };
  setTimeout(tick, 2500);
}

async function requestGameUpdate() {
  const g = S.version && S.version.game;
  if (!g || (!g.update_available && g.installed_buildid)) return;
  const build = g.latest_buildid || 'the current public build';
  const r = await confirmDialog({
    title: g.installed_buildid ? `Update the server to build ${build}?` : 'Install the Valheim server files?',
    tag: 'DOWNTIME',
    body: `<p>The engine stops, SteamCMD validates and downloads build <code>${esc(build)}</code>, then the engine starts again.</p>
           <p style="margin-top:8px">Expect several minutes of downtime and a fresh PlayFab join code.${S.players.length ? ` <b style="color:var(--warn)">${S.players.length} player(s) online will be disconnected.</b>` : ''}</p>
           <p style="margin-top:8px">A world snapshot is not taken automatically. Create one first if the update matters to you.</p>`,
    confirm: 'Update server', danger: true
  });
  if (!r) return;
  progress(true);
  try {
    const j = await postJSON('/api/version/update-game', {});
    toast(j.message, j.ok ? undefined : 'err');
    if (j.ok) pollUpdateState();
  } catch (e) { toast(e.message, 'err'); }
  finally { progress(false); }
}

let updatePollTimer = null;
function pollUpdateState() {
  if (updatePollTimer) clearInterval(updatePollTimer);
  updatePollTimer = setInterval(async () => {
    try {
      const st = await api('/api/version/update-game/state');
      S.updateState = st;
      if (S.tab === 'system') render(); else updateHeader();
      if (!st.running) {
        clearInterval(updatePollTimer);
        updatePollTimer = null;
        toast(st.message || 'Server update finished.', st.ok ? undefined : 'err');
        fetchVersion(false);
        setTimeout(poll, 1500);
      }
    } catch (e) {
      clearInterval(updatePollTimer); updatePollTimer = null;
    }
  }, 4000);
}

/* ---------- events ---------- */

document.addEventListener('click', e => {
  const menu = $('#power-menu');
  if (menu && !menu.hidden && !e.target.closest('.split')) menu.hidden = true;

  const lang = e.target.closest('[data-lang]');
  if (lang) {
    LANG = lang.dataset.lang;
    localStorage.setItem('thorpedo_lang', LANG);
    renderHeader(); render();
    return;
  }
  const tab = e.target.closest('[data-tab]');
  if (tab) { go(tab.dataset.tab); return; }

  const el = e.target.closest('[data-act]');
  if (el) { e.preventDefault(); act(el.dataset.act, el); }
});

document.addEventListener('keydown', e => {
  const navLink = e.target && e.target.closest ? e.target.closest('[data-tab]') : null;
  if (navLink && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go(navLink.dataset.tab); return; }
  if (e.key === 'Escape') {
    const ov = $('#ov');
    if (!ov.hidden) { ov.hidden = true; ov.innerHTML = ''; return; }
    const menu = $('#power-menu');
    if (menu) menu.hidden = true;
  }
  if (e.key === 'Enter' && e.target && e.target.id === 'cmd-input') { e.preventDefault(); sendCommand(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'in-admin') { e.preventDefault(); addToList('admins'); }
  if (e.key === 'Enter' && e.target && e.target.id === 'in-ban') { e.preventDefault(); addToList('bans'); }
});

$('#file-world').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData(); fd.append('file', file);
  progress(true);
  try {
    const j = await api('/api/snapshots/upload-world', { method: 'POST', body: fd });
    toast(j.message, j.ok ? undefined : 'err');
    if (j.ok) fetchSnapshots();
  } catch (err) { toast(err.message, 'err'); }
  finally { progress(false); e.target.value = ''; }
});

$('#file-mod').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData(); fd.append('file', file);
  progress(true);
  try {
    const j = await api('/api/mods/upload', { method: 'POST', body: fd });
    toast(j.message, j.ok ? undefined : 'err');
    if (j.ok) fetchMods();
  } catch (err) { toast(err.message, 'err'); }
  finally { progress(false); e.target.value = ''; }
});

/* ---------- polling ---------- */

async function poll() {
  try { await fetchStatus(); } catch (e) { return; }
  updateHeader();
  if (S.tab === 'overview') {
    // Full redraw is safe here: the view holds no text inputs.
    render();
  } else if (S.tab === 'players') {
    // Only refresh the roster so the SteamID inputs keep what the admin typed.
    const box = $('#roster');
    if (box) box.innerHTML = rosterTable();
    const count = $('#roster-count');
    if (count) count.textContent = S.players.length + ' online';
  } else {
    renderNav();
  }
  fetchLogs().catch(() => {});
}

setInterval(async () => {
  await poll();
  if (S.tab === 'console') { /* console refreshes with poll */ }
}, 4000);

setInterval(() => { fetchVersion(false).catch(() => {}); }, 120000);

/* boot */
renderHeader();
renderNav();
go('overview');
fetchVersion(true);
fetchWorld();
fetchPlayers();
fetchSnapshots();
fetchMods();
fetchSettings();
poll();
</script>
</body></html>
